name: collect

# Free scheduled compute. Runs the collector and commits the updated
# SQLite file back so Streamlit Cloud sees fresh data.
on:
  schedule:
    - cron: "*/30 * * * *"   # every 30 minutes
  workflow_dispatch: {}       # lets you trigger a run manually from the UI

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - run: pip install -r requirements.txt

      - run: python scripts/run_once.py

      - name: Commit updated database
        run: |
          git config user.name  "osint-bot"
          git config user.email "osint-bot@users.noreply.github.com"
          git add data/osint.db
          git diff --staged --quiet || git commit -m "data: scheduled collection $(date -u +%FT%TZ)"
          git push
